<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メンバー募集</title>
<style>
  body { font-family: sans-serif; margin: 0; background: #f4f6f8; color: #2d3748; }
  .head { background: #ff6b6b; color: #fff; padding: 16px; }
  .head small { display: block; font-size: 12px; opacity: .9; }
  .head h1 { margin: 4px 0 0; font-size: 22px; }
  .body { padding: 16px; }
  .info { background: #fff; border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; line-height: 1.8; }
  .list { background: #fff; border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; }
  .list h2 { margin: 0 0 8px; font-size: 15px; }
  .list ol { margin: 0; padding-left: 20px; line-height: 1.8; }
  button { width: 100%; padding: 14px; margin-bottom: 10px; border: 0; border-radius: 10px; font-size: 16px; font-weight: bold; color: #fff; }
  #join { background: #2ec4b6; }
  #leave { background: #a0aec0; }
  #close { background: #e53e3e; }
  button:disabled { opacity: .5; }
  #msg { text-align: center; margin: 12px 0; min-height: 1.4em; }
  .err { color: #e53e3e; }
  .badge { display: inline-block; background: #718096; color: #fff; border-radius: 6px; padding: 2px 8px; font-size: 12px; }
</style>
</head>
<body>
<div id="loading" class="body">読み込み中…</div>
<div id="app" style="display:none">
  <div class="head"><small>🎮 メンバー募集</small><h1 id="game"></h1></div>
  <div class="body">
    <div class="info">
      <div>⏰ 時間: <span id="time"></span></div>
      <div>👥 募集人数: <span id="members"></span></div>
      <div>👑 募集主: <span id="owner"></span> <span id="closedBadge" class="badge" style="display:none">締め切り済み</span></div>
    </div>
    <div class="list"><h2>参加者 (<span id="count"></span>)</h2><ol id="participants"></ol></div>
    <div id="msg"></div>
    <button id="join">参加する</button>
    <button id="leave">キャンセルする</button>
    <button id="close" style="display:none">募集を締め切る（募集主のみ）</button>
  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  // ★ここに LINE Developers で作った LIFF ID を貼る（例: 1234567890-AbCdEfGh）
  const LIFF_ID = 'ここにLIFF_IDを貼る';

  let recId = null;
  let profile = null;
  let rec = null;

  const $ = (id) => document.getElementById(id);

  function showMsg(text, isErr) {
    $('msg').textContent = text || '';
    $('msg').className = isErr ? 'err' : '';
  }

  function getRecId() {
    const q = new URLSearchParams(location.search);
    if (q.get('recId')) return q.get('recId');
    // liff.state 経由で渡ってくる場合
    const state = q.get('liff.state');
    if (state) {
      const s = decodeURIComponent(state);
      const m = s.match(/recId=([^&]+)/);
      if (m) return m[1];
    }
    return null;
  }

  function render() {
    $('loading').style.display = 'none';
    $('app').style.display = 'block';
    $('game').textContent = rec.game;
    $('time').textContent = rec.time;
    $('members').textContent = rec.members;
    $('owner').textContent = rec.participants[0] || '';
    $('count').textContent = rec.participants.length;
    $('participants').innerHTML = '';
    rec.participants.forEach((name) => {
      const li = document.createElement('li');
      li.textContent = name;
      $('participants').appendChild(li);
    });

    const closed = !!rec.closed;
    $('closedBadge').style.display = closed ? 'inline-block' : 'none';
    const joined = rec.participants.includes(profile.displayName);
    $('join').style.display = closed || joined ? 'none' : 'block';
    $('leave').style.display = closed || !joined ? 'none' : 'block';
    $('close').style.display = !closed && profile.userId === rec.ownerId ? 'block' : 'none';
  }

  async function load() {
    const res = await fetch('/api/recruitment/' + encodeURIComponent(recId));
    if (res.status === 404) {
      $('loading').style.display = 'block';
      $('loading').textContent = 'この募集は終了しました。';
      $('app').style.display = 'none';
      return false;
    }
    rec = await res.json();
    render();
    return true;
  }

  async function act(action) {
    showMsg('');
    ['join', 'leave', 'close'].forEach((id) => ($(id).disabled = true));
    try {
      const res = await fetch('/api/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          recId,
          userId: profile.userId,
          userName: profile.displayName,
          action
        })
      });
      const data = await res.json();
      if (!res.ok) {
        showMsg(data.error || 'エラーが発生しました', true);
      } else {
        rec = data.rec;
        render();
      }
    } catch (e) {
      showMsg('通信エラーが発生しました', true);
    }
    ['join', 'leave', 'close'].forEach((id) => ($(id).disabled = false));
  }

  async function main() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      profile = await liff.getProfile();
      recId = getRecId();
      if (!recId) {
        $('loading').textContent = '募集が指定されていません。トークのカードのボタンから開いてください。';
        return;
      }
      const ok = await load();
      if (ok) setInterval(load, 15000); // 15秒ごとに自動更新
    } catch (e) {
      $('loading').textContent = '読み込みに失敗しました: ' + e.message;
    }
  }

  $('join').onclick = () => act('join');
  $('leave').onclick = () => act('leave');
  $('close').onclick = () => {
    if (confirm('この募集を締め切りますか？')) act('close');
  };

  main();
</script>
</body>
</html>
