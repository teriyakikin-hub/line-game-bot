<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゲーム募集★みんなであそぼう！</title>
  <!-- Google Fonts から丸ゴシック（ポップ系フォント）を読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'M PLUS Rounded 1c', sans-serif;
    }
    body {
      background: #EBF8FF;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #FFFFFF;
      width: 100%;
      max-width: 400px;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      border: 4px solid #4ECDC4;
      text-align: center;
      position: relative;
    }
    .status-badge {
      display: inline-block;
      background: #FF6B6B;
      color: #FFF;
      font-weight: 900;
      font-size: 14px;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    .game-title {
      font-size: 26px;
      font-weight: 900;
      color: #2D3748;
      margin: 4px 0 16px 0;
      word-break: break-all;
    }
    .info-box {
      background: #FFF9E6;
      border: 2px dashed #FFE066;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 16px;
      text-align: left;
    }
    .info-item {
      font-size: 15px;
      font-weight: 800;
      color: #4A5568;
      margin: 6px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .members-box {
      background: #F0FFF4;
      border: 2px solid #C6F6D5;
      border-radius: 16px;
      padding: 12px;
      text-align: left;
      margin-bottom: 20px;
    }
    .members-title {
      font-weight: 900;
      color: #2F855A;
      font-size: 15px;
      margin-bottom: 6px;
    }
    .members-list {
      font-weight: 800;
      color: #2D3748;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-all;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 16px;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.15);
      transition: all 0.1s ease;
    }
    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
    }
    .btn-join {
      background: #2EC4B6;
      color: #FFF;
    }
    .btn-leave {
      background: #CBD5E0;
      color: #4A5568;
    }
    .btn-close {
      background: #FF9F1C;
      color: #FFF;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="status" class="status-badge">🎮 メンバー募集中！</div>
    <div id="game" class="game-title">読み込み中...</div>

    <div class="info-box">
      <div class="info-item">⏰ スタート：<span id="time">-</span></div>
      <div class="info-item">👥 ぼしゅう人数：<span id="members">-</span></div>
    </div>

    <div class="members-box">
      <div class="members-title">✨ さんかする人（<span id="count">0</span>）</div>
      <div id="participant-list" class="members-list">読み込み中...</div>
    </div>

    <div id="buttons" class="btn-group">
      <button class="btn btn-join" onclick="handleAction('join')">✨ さんかする！</button>
      <button class="btn btn-leave" onclick="handleAction('leave')">💦 キャンセル</button>
      <button class="btn btn-close" onclick="handleAction('close')">🔒 しめきる（主のみ）</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const recId = urlParams.get('recId');
    let userProfile = null;

    async function init() {
      // 自分のLIFF IDに合わせてね
      await liff.init({ liffId: "YOUR_LIFF_ID" });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      userProfile = await liff.getProfile();
      loadData();
    }

    async function loadData() {
      const res = await fetch(`/api/recruitment/${recId}`);
      if (!res.ok) {
        document.body.innerHTML = '<h3>この募集は見つかりませんでした💦</h3>';
        return;
      }
      const data = await res.json();
      document.getElementById('game').innerText = data.game;
      document.getElementById('time').innerText = data.time;
      document.getElementById('members').innerText = data.members;
      
      const count = data.participants ? data.participants.length : 0;
      document.getElementById('count').innerText = count + '人';

      const list = count > 0 ? data.participants.join(' 、 ') : 'まだ誰もいません！';
      document.getElementById('participant-list').innerText = list;

      if (data.closed) {
        const statusEl = document.getElementById('status');
        statusEl.innerText = '❌ しめきりました';
        statusEl.style.background = '#A0AEC0';
        document.getElementById('buttons').style.display = 'none';
      }
    }

    async function handleAction(action) {
      const res = await fetch('/api/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          recId: recId,
          userId: userProfile.userId,
          userName: userProfile.displayName,
          action: action
        })
      });
      const result = await res.json();
      if (result.error) {
        alert(result.error);
      } else {
        loadData();
      }
    }

    init();
  </script>
</body>
</html>
